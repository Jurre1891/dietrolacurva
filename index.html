<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dietro la Curva</title>
<meta name="description" content="Trainers, terraces and the odd good book. Links from our posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #1C263A; --cream: #EDE6D6; --dampad: #A0A5B2; --kant: #2E3A52; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--navy); color: var(--cream); font: 16px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
header { text-align: center; margin-bottom: 40px; }
h1 { font: 64px/1 "Bebas Neue", Impact, sans-serif; letter-spacing: .5px; margin: 0; }
.slogan { color: var(--dampad); margin: 8px 0 16px; }
header a { color: var(--cream); }
article { border: 1px solid var(--kant); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
article img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.innehall { padding: 16px; }
.datum { color: var(--dampad); font-size: 13px; margin: 0; }
h2 { font: 32px/1.1 "Bebas Neue", Impact, sans-serif; margin: 4px 0 12px; }
h2 a { color: inherit; text-decoration: none; }
.lank { display: flex; align-items: center; gap: 8px; padding: 12px 14px; margin-top: 8px; border-radius: 8px;
  background: var(--cream); color: var(--navy); text-decoration: none; font-weight: 600; }
.lank:hover { opacity: .9; }
.namn { flex: 1; }
.butik { font-weight: 400; font-size: 14px; }
.ad { font-size: 12px; border: 1px solid var(--navy); border-radius: 4px; padding: 0 4px; }
.tom, footer { color: var(--dampad); text-align: center; }
footer { font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<main>
<header>
<h1>Dietro la Curva</h1>
<p class="slogan">Happily behind the curve.</p>
<a href="https://www.instagram.com/dietro.la.curva/">Instagram</a>
</header>
<p class="tom">Links from our posts will show up here.</p>
<footer>Links marked Ad earn us a small commission. It costs you nothing extra.</footer>
</main>
</body>
</html>
